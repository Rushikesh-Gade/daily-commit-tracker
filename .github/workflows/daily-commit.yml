name: Daily Auto Commit

on:
  schedule:
    # Runs everyday at 12:00 UTC (Adjust time as needed)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Make Changes to File
      run: |
        echo "Last automated update: $(date)" > daily_log.txt

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add daily_log.txt
        git commit -m "chore: automated daily update [skip ci]" || exit 0
        git push
